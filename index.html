.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}.dl dt{color:var(--mut);font-weight:600}.dl dd{margin:0}
.dlist{display:flex;flex-direction:column}

.qr svg{width:92px;height:92px;display:block}

.okmark{width:64px;height:64px;border-radius:50%;background:var(--okbg);display:grid;place-items:center;color:var(--ok);flex:0 0 auto}.okmark svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

 body{background:#fff;padding:0}.demo-banner,.topbar,.side,.nav-b,.no-print,.toast,.modal-bg{display:none!important}

const lotSort = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : nOf(a.id) - nOf(b.id);
function addLot(c, o) {
  const lot = { id: uid(c, 'l'), pid: o.pid, code: o.code, origin: o.origin || '', cost: o.cost, qtyIn: o.qty, left: o.qty, date: o.date, ref: o.ref || '', supNum: o.supNum || '', kind: o.kind || 'compra' };
  c.lots.push(lot);
  const mv = { id: uid(c, 'm'), n: 0, date: o.date, pid: o.pid, lotId: lot.id, type: o.moveType || 'entrada', qty: o.qty, cost: lineAmount(o.qty, o.cost), docId: o.ref || '' };
  mv.n = nOf(mv.id); c.moves.push(mv);
  return lot;
}
function consume(c, pid, qty, date, type, docId, note) {
  const lots = c.lots.filter(l => l.pid === pid && l.left > 0).sort(lotSort);
  const have = lots.reduce((s, l) => s + l.left, 0);
  if (have < qty) throw new Error('Stock insuficiente de «' + prod(c, pid).name + '»: hay ' + Core.fmtQty(have) + ' y se piden ' + Core.fmtQty(qty));
  let rest = qty, cost = 0;
  for (const l of lots) {
    if (!rest) break;
    const take = Math.min(rest, l.left); l.left -= take; rest -= take;
    const cst = lineAmount(take, l.cost); cost += cst;
    const mv = { id: uid(c, 'm'), n: 0, date, pid, lotId: l.id, type, qty: take, cost: cst, docId: docId || '', note: note || '' };
    mv.n = nOf(mv.id); c.moves.push(mv);
  }
  return cost;
}
// valoración de existencias: método 'fifo' (lotes) o 'medio' (coste medio ponderado)
Core.valuation = function (c, method) {
  method = method || c.method;
  const by = {};
  if (method === 'fifo') {
    for (const l of c.lots) { const b = by[l.pid] || (by[l.pid] = { qty: 0, value: 0 }); b.qty += l.left; b.value += lineAmount(l.left, l.cost); }
  } else {
    const mv = c.moves.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.n - b.n);
    for (const m of mv) {
      const b = by[m.pid] || (by[m.pid] = { qty: 0, value: 0 });
      if (m.type === 'entrada' || m.type === 'inicial' || m.type === 'ajuste+') { b.qty += m.qty; b.value += lineAmount(m.qty, c.lots.find(l => l.id === m.lotId).cost); }
      else { const out = b.qty ? divRound(b.value * m.qty, b.qty) : 0; b.qty -= m.qty; b.value -= out; }
    }
  }
  let total = 0; for (const k in by) total += by[k].value;
  return { total, by };
};
Core.refCost = (c, pid) => {
  const v = Core.valuation(c).by[pid];
  if (v && v.qty > 0) return divRound(v.value * 1000, v.qty);
  const ls = c.lots.filter(l => l.pid === pid).sort(lotSort);
  return ls.length ? ls[ls.length - 1].cost : 0;
};
Core.priceFromMargin = (cost, marginPct) => Math.round(cost * (1 + marginPct / 100));
Core.marginOf = (cost, price) => cost ? Math.round(((price - cost) / cost) * 1000) / 10 : 0;

/* regularización automática de existencias (asiento de variación) */
function recomputeVariation(c) {
  const y = c.ejercicio;
  if (c.closed.includes(y)) return;
  c.journal = c.journal.filter(e => !(e.kind === 'var' && !e.final && yearOf(e.date) === y));
  const diff = Core.valuation(c).total - net(balances(c), '300');
  if (!diff) return;
  const t = Core.today(); let date = t < y + '-01-01' ? y + '-01-01' : (t > y + '-12-31' ? y + '-12-31' : t);
  post(c, { date, concept: 'Variación de existencias (regularización automática a ' + (c.method === 'fifo' ? 'FIFO' : 'coste medio') + ')', kind: 'var', auto: true,
    lines: diff > 0 ? [{ acc: '300', d: diff }, { acc: '610', h: diff }] : [{ acc: '610', d: -diff }, { acc: '300', h: -diff }] });
}
function touch(c) { recomputeVariation(c); }
Core.touch = touch;
Core.setMethod = (c, m) => { if (m !== 'fifo' && m !== 'medio') throw new Error('Método no válido'); c.method = m; touch(c); };

Core.addProduct = (c, o) => {
  if (!o.name || !o.name.trim()) throw new Error('Falta el nombre del producto');
  if (c.products.some(p => norm(p.name) === norm(o.name))) throw new Error('Ya existe un producto con ese nombre');
  const p = { id: uid(c, 'p'), name: o.name.trim(), unit: o.unit || 'kg', family: o.family || 'General', price: o.price || 0, margin: o.margin || 0, counted: null, countedDate: null };
  c.products.push(p); return p;
};
Core.updateProduct = (c, id, o) => { const p = prod(c, id); Object.assign(p, o); return p; };

Core.registerMerma = function (c, o) {
  assertOpen(c, o.date);
  const qty = o.qty; if (!Number.isInteger(qty) || qty <= 0) throw new Error('Cantidad de merma no válida');
  const before = Core.valuation(c).by; const b0 = (before[o.pid] || { value: 0 }).value;
  consume(c, o.pid, qty, o.date, 'merma', '', o.motive || 'Merma');
  const after = Core.valuation(c).by; const value = b0 - (after[o.pid] || { value: 0 }).value;
  let entry = null;
  if (value > 0) entry = post(c, { date: o.date, concept: (o.motive || 'Merma') + ' · ' + prod(c, o.pid).name + ' · ' + Core.fmtQty(qty) + ' ' + prod(c, o.pid).unit, kind: 'merma', ref: o.pid, lines: [{ acc: '659', d: value }, { acc: '300', h: value }] });
  audit(c, 'Merma registrada: ' + prod(c, o.pid).name + ' ' + Core.fmtQty(qty) + ' (' + (o.motive || 'Merma') + ')');
  touch(c); return { value, entry };
};
Core.setCount = (c, pid, counted) => { const p = prod(c, pid); p.counted = counted == null ? null : counted; p.countedDate = counted == null ? null : Core.today(); };
Core.adjustToCount = function (c, pid, date) {
  const p = prod(c, pid); if (p.counted == null) throw new Error('Primero introduce el stock contado');
  const diff = p.counted - stockOf(c, pid);
  if (diff === 0) return { diff: 0 };
  if (diff < 0) { const r = Core.registerMerma(c, { pid, qty: -diff, date, motive: 'Ajuste de inventario' }); return { diff, value: r.value }; }
  assertOpen(c, date);
  const cost = Core.refCost(c, pid);
  const lot = addLot(c, { pid, code: 'AJ-' + date.replace(/-/g, '').slice(2), origin: 'Ajuste de inventario', cost, qty: diff, date, ref: 'ajuste', kind: 'ajuste', moveType: 'ajuste+' });
  const value = lineAmount(diff, cost);
  if (value > 0) post(c, { date, concept: 'Ajuste de inventario (+) · ' + p.name + ' · ' + Core.fmtQty(diff), kind: 'ajuste', ref: pid, lines: [{ acc: '300', d: value }, { acc: '778', h: value }] });
  audit(c, 'Ajuste de inventario: ' + p.name + ' +' + Core.fmtQty(diff));
  touch(c); return { diff, value };
};
Core.cuadre = function (c, q) {
  const nq = norm(q || '');
  const val = Core.valuation(c).by;
  return c.products.filter(p => {
    if (!nq) return true;
    if (norm(p.name).includes(nq) || norm(p.family).includes(nq)) return true;
    return c.lots.some(l => l.pid === p.id && (norm(l.code).includes(nq) || norm(l.origin).includes(nq)));
  }).map(p => {
    const b = Core.stockBreakdown(c, p.id);
    const lotsLeft = c.lots.filter(l => l.pid === p.id).reduce((s, l) => s + l.left, 0);
    return Object.assign({ p, lotsLeft, ok: lotsLeft === b.teorico, value: (val[p.id] || { value: 0 }).value,
      counted: p.counted, diff: p.counted == null ? null : p.counted - b.teorico }, b);
  });
};

/* ───────── compras / gastos ───────── */
Core.addSupplier = (c, o) => { if (!o.name) throw new Error('Falta el nombre'); const s = { id: uid(c, 's'), name: o.name, nif: o.nif || '', address: o.address || '', email: o.email || '', phone: o.phone || '', terms: o.terms == null ? 30 : o.terms }; c.suppliers.push(s); return s; };
Core.addClient = (c, o) => { if (!o.name) throw new Error('Falta el nombre'); const s = { id: uid(c, 'c'), name: o.name, nif: o.nif || '', address: o.address || '', email: o.email || '', phone: o.phone || '', terms: o.terms == null ? 30 : o.terms }; c.clients.push(s); return s; };
Core.nifWarning = nif => { nif = (nif || '').trim().toUpperCase(); if (!nif) return 'Sin NIF'; if (!/^([A-Z]\d{7}[0-9A-J]|\d{8}[A-Z]|[XYZ]\d{7}[A-Z])$/.test(nif)) return 'NIF con formato dudoso (revisar letra)'; return ''; };

Core.addPurchase = function (c, o) {
  assertOpen(c, o.date);
  const sup = c.suppliers.find(s => s.id === o.supplierId); if (!sup) throw new Error('Elige un proveedor');
  if (!o.num || !String(o.num).trim()) throw new Error('Falta el nº de albarán del proveedor');
  if (c.purchases.some(p => p.supplierId === sup.id && norm(p.num) === norm(o.num))) throw new Error('El albarán ' + o.num + ' de ' + sup.name + ' ya está registrado');
  if (!o.lines || !o.lines.length) throw new Error('Añade al menos un producto');
  const received = o.receivedDate || o.date; assertOpen(c, received);
  let base = 0; const lines = o.lines.map((l, i) => {
    const p = prod(c, l.pid);
    if (!Number.isInteger(l.qty) || l.qty <= 0) throw new Error('Cantidad no válida en ' + p.name);
    if (!Number.isInteger(l.cost) || l.cost < 0) throw new Error('Coste no válido en ' + p.name);
    const amount = lineAmount(l.qty, l.cost); base += amount;
    return { pid: p.id, desc: p.name, qty: l.qty, cost: l.cost, amount, lot: (l.lot || '').trim() || ('L' + received.replace(/-/g, '').slice(2) + '-' + (i + 1)), origin: l.origin || '' };
  });
  const rate = o.rate == null ? c.igic : o.rate;
  const igic = divRound(base * rate, 100), total = base + igic;
  const pur = { id: uid(c, 'u'), kind: 'compra', supplierId: sup.id, num: o.num.trim(), date: o.date, receivedDate: received, receivedBy: o.receivedBy || '', lines, base, igic, total, pay: o.pay || 'credito', paid: null, due: addDays(o.date, sup.terms), entry: null };
  c.purchases.push(pur);
  const credit = pur.pay === 'credito';
  const cash = pur.pay === 'efectivo' ? '570' : '572';
  const e = post(c, { date: o.date, concept: 'Compra ' + sup.name + ' · albarán ' + pur.num, kind: 'compra', ref: pur.id, lines: [{ acc: '600', d: base }, { acc: '472', d: igic }, { acc: credit ? '400' : cash, h: total }] });
  pur.entry = e.id; if (!credit) pur.paid = o.date;
  for (const l of lines) addLot(c, { pid: l.pid, code: l.lot, origin: l.origin, cost: l.cost, qty: l.qty, date: received, ref: pur.id, supNum: pur.num });
  audit(c, 'Entrada de mercancía: albarán ' + pur.num + ' de ' + sup.name + ' (' + Core.eur(total) + ')');
  touch(c); return pur;
};
Core.addExpense = function (c, o) {
  assertOpen(c, o.date);
  if (!ACC[o.account] || ACC[o.account].type !== 'gasto') throw new Error('Cuenta de gasto no válida');
  if (!Number.isInteger(o.base) || o.base <= 0) throw new Error('Importe no válido');
  const sup = o.supplierId ? c.suppliers.find(s => s.id === o.supplierId) : null;
  const rate = o.rate == null ? c.igic : o.rate;
  const igic = divRound(o.base * rate, 100), total = o.base + igic;
  const pay = o.pay || 'credito';
  const pur = { id: uid(c, 'u'), kind: 'gasto', supplierId: sup ? sup.id : '', num: o.num || '', date: o.date, concept: o.concept || ACC[o.account].name, account: o.account, lines: [], base: o.base, igic, total, pay, paid: null, due: addDays(o.date, sup ? sup.terms : 30), entry: null };
  c.purchases.push(pur);
  const credit = pay === 'credito';
  const e = post(c, { date: o.date, concept: pur.concept + (sup ? ' · ' + sup.name : ''), kind: 'gasto', ref: pur.id, lines: [{ acc: o.account, d: o.base }, { acc: '472', d: igic }, { acc: credit ? '410' : (pay === 'efectivo' ? '570' : '572'), h: total }] });
  pur.entry = e.id; if (!credit) pur.paid = o.date;
  touch(c); return pur;
};
Core.payPurchase = function (c, id, o) {
  const p = c.purchases.find(x => x.id === id); if (!p) throw new Error('No encontrado');
  if (p.paid) throw new Error('Ya está pagado');
  assertOpen(c, o.date);
  post(c, { date: o.date, concept: 'Pago ' + (p.num || p.concept), kind: 'pago', ref: p.id, lines: [{ acc: p.kind === 'compra' ? '400' : '410', d: p.total }, { acc: o.method === 'efectivo' ? '570' : '572', h: p.total }] });
  p.paid = o.date; p.paidMethod = o.method || 'transferencia';
  audit(c, 'Pago registrado: ' + (p.num || p.concept) + ' ' + Core.eur(p.total));
  touch(c); return p;
};
Core.payables = c => c.purchases.filter(p => !p.paid).map(p => ({ p, due: p.due, overdue: p.due < Core.today(), who: (c.suppliers.find(s => s.id === p.supplierId) || { name: 'Varios' }).name })).sort((a, b) => a.due < b.due ? -1 : 1);

/* ───────── ventas: albaranes y facturas ───────── */
const docNum = (c, type) => type === 'albaran' ? 'A-' + c.serie + '-' + pad(++c.num.alb, 4) : c.serie + '-' + pad(++c.num.fac, 4);
Core.createDoc = function (c, o) {
  assertOpen(c, o.date);
  const cl = c.clients.find(x => x.id === o.clientId); if (!cl) throw new Error('Elige un cliente');
  if (!o.lines || !o.lines.length) throw new Error('Añade al menos una línea');
  const type = o.type === 'albaran' ? 'albaran' : 'factura';
  const need = {};
  const lines = o.lines.map(l => {
    if (!Number.isInteger(l.qty) || l.qty <= 0) throw new Error('Cantidad no válida');
    if (!Number.isInteger(l.price) || l.price < 0) throw new Error('Precio no válido');
    let desc = l.desc, unit = l.unit || 'ud';
    if (l.pid) { const p = prod(c, l.pid); desc = p.name; unit = p.unit; need[l.pid] = (need[l.pid] || 0) + l.qty; }
    if (!desc) throw new Error('Falta la descripción de una línea');
    return { pid: l.pid || null, desc, unit, qty: l.qty, price: l.price, amount: lineAmount(l.qty, l.price), cost: 0 };
  });
  for (const pid in need) { const have = stockOf(c, pid); if (have < need[pid]) throw new Error('Stock insuficiente de «' + prod(c, pid).name + '»: hay ' + Core.fmtQty(have) + ' y se piden ' + Core.fmtQty(need[pid])); }
  const baseP = lines.filter(l => l.pid).reduce((s, l) => s + l.amount, 0), baseS = lines.filter(l => !l.pid).reduce((s, l) => s + l.amount, 0);
  const base = baseP + baseS, igic = divRound(base * c.igic, 100), total = base + igic;
  const pay = o.pay || 'credito';
  const doc = { id: uid(c, 'd'), type, num: docNum(c, type), date: o.date, clientId: cl.id, lines, base, igic, total, rate: c.igic, pay, signed: null, paid: null, invoicedIn: null, groups: null, entry: null, note: o.note || '' };
  c.docs.push(doc);
  for (const l of lines) if (l.pid) l.cost = consume(c, l.pid, l.qty, o.date, 'venta', doc.id, doc.num);
  const cash = pay === 'efectivo' ? '570' : '572';
  const e = post(c, { date: o.date, concept: (type === 'albaran' ? 'Albarán ' : 'Factura ') + doc.num + ' · ' + cl.name, kind: 'venta', ref: doc.id,
    lines: [{ acc: pay === 'credito' ? '430' : cash, d: total }, { acc: '700', h: baseP }, { acc: '705', h: baseS }, { acc: '477', h: igic }] });
  doc.entry = e.id;
  if (pay !== 'credito') { doc.paid = o.date; doc.paidMethod = pay; }
  for (const l of lines) if (l.pid) c.prices[cl.id + '|' + l.pid] = l.price;
  touch(c); return doc;
};
Core.docClient = (c, d) => c.clients.find(x => x.id === d.clientId) || { name: '—' };
Core.docStatus = function (d) {
  const sign = d.signed ? 'Firmado' : 'Sin firmar';
  let pay;
  if (d.paid) pay = 'Cobrado'; else if (d.invoicedIn) pay = 'Facturado'; else pay = d.type === 'albaran' ? 'Pendiente de facturar' : 'Pendiente de cobro';
  return { sign, pay, signed: !!d.signed, paid: !!d.paid, invoiced: !!d.invoicedIn };
};
Core.signDoc = function (c, id, o) {
  const d = c.docs.find(x => x.id === id); if (!d) throw new Error('Documento no encontrado');
  if (d.signed) throw new Error('El documento ya está firmado');
  const name = (o.name || '').trim(); if (name.length < 2) throw new Error('Escribe el nombre de quien firma');
  if (!o.sig || !o.sig.paths || !o.sig.paths.length) throw new Error('Falta la firma manuscrita');
  const ts = o.ts || new Date().toISOString();
  d.signed = { name, ts, sig: o.sig, hash: '' };
  d.signed.hash = Core.docHash(c, d);
  audit(c, 'Documento ' + d.num + ' firmado por ' + name);
  return d;
};
Core.docHash = (c, d) => Core.sha256(JSON.stringify({ emp: c.id, num: d.num, date: d.date, client: d.clientId, lines: d.lines.map(l => [l.desc, l.qty, l.price, l.amount]), base: d.base, igic: d.igic, total: d.total, groups: d.groups, name: d.signed.name, ts: d.signed.ts, sig: d.signed.sig }));
Core.verifyDoc = (c, d) => !!d.signed && d.signed.hash === Core.docHash(c, d);

Core.invoiceDocs = function (c, o) {
  assertOpen(c, o.date);
  const albs = o.ids.map(id => c.docs.find(d => d.id === id));
  if (!albs.length || albs.some(a => !a)) throw new Error('No hay albaranes que facturar');
  for (const a of albs) {
    if (a.type !== 'albaran' || a.clientId !== o.clientId) throw new Error('Los albaranes deben ser del mismo cliente');
    if (a.invoicedIn) throw new Error('El albarán ' + a.num + ' ya está facturado');
    if (a.paid) throw new Error('El albarán ' + a.num + ' ya está cobrado');
    if (!a.signed) throw new Error('El albarán ' + a.num + ' no está firmado');
  }
  const lines = []; albs.forEach(a => a.lines.forEach(l => lines.push(Object.assign({}, l, { albNum: a.num, albDate: a.date }))));
  const base = albs.reduce((s, a) => s + a.base, 0), igic = albs.reduce((s, a) => s + a.igic, 0);
  const doc = { id: uid(c, 'd'), type: 'factura', num: docNum(c, 'factura'), date: o.date, clientId: o.clientId, lines, base, igic, total: base + igic, rate: c.igic, pay: 'credito', signed: null, paid: null, invoicedIn: null, groups: albs.map(a => a.id), entry: null, note: 'Factura mensual con relación de albaranes' };
  c.docs.push(doc); albs.forEach(a => { a.invoicedIn = doc.id; });
  audit(c, 'Factura ' + doc.num + ' emitida agrupando ' + albs.length + ' albaranes');
  return doc;
};
Core.monthSummary = function (c, ym) {
  const out = {};
  for (const d of c.docs) if (d.type === 'albaran' && !d.invoicedIn && d.date.startsWith(ym)) {
    const o = out[d.clientId] || (out[d.clientId] = { client: Core.docClient(c, d), signed: [], unsigned: [], total: 0 });
    (d.signed ? o.signed : o.unsigned).push(d); if (d.signed) o.total += d.total;
  }
  return Object.values(out);
};
Core.invoiceMonth = (c, clientId, ym, date) => {
  const ids = c.docs.filter(d => d.type === 'albaran' && d.clientId === clientId && !d.invoicedIn && d.signed && d.date.startsWith(ym)).map(d => d.id);
  return Core.invoiceDocs(c, { clientId, ids, date });
};
Core.collect = function (c, id, o) {
  const d = c.docs.find(x => x.id === id); if (!d) throw new Error('Documento no encontrado');
  if (d.paid) throw new Error('Ya está cobrado');
  if (d.invoicedIn) throw new Error('Este albarán se cobra en su factura ' + c.docs.find(x => x.id === d.invoicedIn).num);
  assertOpen(c, o.date);
  post(c, { date: o.date, concept: 'Cobro ' + d.num + ' · ' + Core.docClient(c, d).name, kind: 'cobro', ref: d.id, lines: [{ acc: o.method === 'efectivo' ? '570' : '572', d: d.total }, { acc: '430', h: d.total }] });
  d.paid = o.date; d.paidMethod = o.method || 'transferencia';
  if (d.groups) d.groups.forEach(g => { const a = c.docs.find(x => x.id === g); a.paid = o.date; a.paidMethod = d.paidMethod; });
  audit(c, 'Cobro registrado: ' + d.num + ' ' + Core.eur(d.total));
  touch(c); return d;
};
Core.dueDate = (c, d) => addDays(d.date, (Core.docClient(c, d).terms) || 0);
Core.receivables = c => c.docs.filter(d => !d.paid && !d.invoicedIn).map(d => { const due = Core.dueDate(c, d); return { d, due, overdue: due < Core.today(), age: diffDays(d.date, Core.today()), who: Core.docClient(c, d).name }; }).sort((a, b) => a.due < b.due ? -1 : 1);
Core.aging = function (c) {
  const rows = {}; const tot = { b0: 0, b1: 0, b2: 0, b3: 0, total: 0 };
  for (const r of Core.receivables(c)) {
    const k = r.d.clientId; const o = rows[k] || (rows[k] = { client: Core.docClient(c, r.d), b0: 0, b1: 0, b2: 0, b3: 0, total: 0, docs: [] });
    const b = r.age <= 30 ? 'b0' : r.age <= 60 ? 'b1' : r.age <= 90 ? 'b2' : 'b3';
    o[b] += r.d.total; o.total += r.d.total; tot[b] += r.d.total; tot.total += r.d.total; o.docs.push(r);
  }
  return { rows: Object.values(rows).sort((a, b) => b.total - a.total), tot };
};

/* ───────── activos fijos, IGIC, banco ───────── */
Core.addAsset = function (c, o) {
  assertOpen(c, o.date);
  if (!['206', '216', '217', '218'].includes(o.account)) throw new Error('Cuenta de inmovilizado no válida');
  if (!Number.isInteger(o.base) || o.base <= 0) throw new Error('Importe no válido');
  if (!Number.isInteger(o.life) || o.life < 1) throw new Error('Vida útil no válida');
  const igic = divRound(o.base * c.igic, 100);
  const a = { id: uid(c, 'a'), name: o.name || 'Activo', account: o.account, date: o.date, cost: o.base, life: o.life, accum: 0, hist: {} };
  c.assets.push(a);
  post(c, { date: o.date, concept: 'Compra de inmovilizado · ' + a.name, kind: 'activo', ref: a.id, lines: [{ acc: o.account, d: o.base }, { acc: '472', d: igic }, { acc: '572', h: o.base + igic }] });
  touch(c); return a;
};
Core.amortize = function (c, year) {
  year = year || c.ejercicio;
  if (c.closed.includes(year)) throw new Error('Ejercicio cerrado');
  if (c.amortYears[year]) throw new Error('La amortización de ' + year + ' ya está contabilizada');
  let total = 0; const det = [];
  for (const a of c.assets) {
    if (yearOf(a.date) > year) continue;
    const months = yearOf(a.date) === year ? 13 - monthOf(a.date) : 12;
    let amt = divRound(a.cost * months, a.life * 12);
    amt = Math.min(amt, a.cost - a.accum); if (amt <= 0) continue;
    a.accum += amt; a.hist[year] = amt; total += amt; det.push(a.name + ' ' + Core.eurPlain(amt));
  }
  if (!total) throw new Error('No hay nada que amortizar en ' + year);
  const date = year + '-12-31' > Core.today() && yearOf(Core.today()) === year ? Core.today() : year + '-12-31';
  const e = post(c, { date, concept: 'Amortización lineal ' + year + ' (' + det.join(' · ') + ')', kind: 'amort', ref: String(year), lines: [{ acc: '681', d: total }, { acc: '281', h: total }] });
  c.amortYears[year] = e.id; audit(c, 'Amortización ' + year + ' contabilizada: ' + Core.eur(total));
  touch(c); return e;
};
Core.assetTable = (c, year) => c.assets.map(a => ({ a, annual: divRound(a.cost, a.life), thisYear: a.hist[year || c.ejercicio] || 0, net: a.cost - a.accum }));

Core.igicQuarter = function (c, year, q) {
  const m1 = (q - 1) * 3 + 1, m2 = q * 3;
  const f = e => yearOf(e.date) === year && monthOf(e.date) >= m1 && monthOf(e.date) <= m2 && e.kind !== 'igic' && e.kind !== 'apertura' && e.kind !== 'cierre' && e.kind !== 'regul';
  const m = balances(c, f);
  const rep = -net(m, '477'), sop = net(m, '472');
  return { year, q, rep, sop, result: rep - sop, done: c.igicLiq[year + 'T' + q] || null, end: year + '-' + pad(m2) + '-' + (m2 === 3 || m2 === 12 ? '31' : '30') };
};
Core.igicLiquidate = function (c, year, q) {
  const r = Core.igicQuarter(c, year, q);
  if (r.done) throw new Error('El trimestre ya está liquidado');
  if (!r.rep && !r.sop) throw new Error('Sin movimientos de IGIC en el trimestre');
  const t = Core.today(); const date = r.end < t ? r.end : t;
  const lines = [{ acc: '477', d: r.rep }, { acc: '472', h: r.sop }];
  if (r.result > 0) lines.push({ acc: '4750', h: r.result }); else if (r.result < 0) lines.push({ acc: '4700', d: -r.result });
  const e = post(c, { date, concept: 'Liquidación IGIC ' + q + 'T ' + year + ' (ejemplo, por validar)', kind: 'igic', ref: year + 'T' + q, lines });
  c.igicLiq[year + 'T' + q] = e.id; audit(c, 'Liquidación IGIC ' + q + 'T ' + year + ': ' + Core.eur(r.result));
  touch(c); return e;
};
Core.igicPay = function (c, year, q, date) {
  const r = Core.igicQuarter(c, year, q);
  if (!r.done) throw new Error('Primero contabiliza la liquidación');
  if (r.result <= 0) throw new Error('No hay importe a ingresar');
  const key = year + 'T' + q + 'p'; if (c.igicLiq[key]) throw new Error('Ya está pagado');
  const e = post(c, { date, concept: 'Pago IGIC ' + q + 'T ' + year, kind: 'pagoigic', ref: key, lines: [{ acc: '4750', d: r.result }, { acc: '572', h: r.result }] });
  c.igicLiq[key] = e.id; touch(c); return e;
};

/* conciliación bancaria sencilla */
Core.parseBankCSV = function (text) {
  const out = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const parts = line.split(/;|\t/); if (parts.length < 3) continue;
    if (/fecha/i.test(parts[0])) continue;
    let d = parts[0].trim();
    const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (m) d = m[3] + '-' + m[2] + '-' + m[1];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    const cents = Core.parseEur(parts[parts.length - 1]); if (isNaN(cents)) continue;
    out.push({ date: d, concept: parts.slice(1, -1).join(' ').trim(), cents });
  }
  return out;
};
Core.reconcile = function (c, lines) {
  const used = new Set();
  return lines.map(l => {
    const nc = norm(l.concept); const r = { date: l.date, concept: l.concept, cents: l.cents, status: 'none', kind: '', id: '', label: '', diff: 0 };
    if (l.cents > 0) {
      const open = c.docs.filter(d => !d.paid && !d.invoicedIn && !used.has(d.id));
      const byKey = d => nc.includes(norm(Core.docClient(c, d).name).split(' ')[0]) || nc.includes(norm(d.num));
      let hit = open.find(d => d.total === l.cents && byKey(d)) || open.find(d => d.total === l.cents && nc.includes(norm(d.num)));
      if (hit) { used.add(hit.id); Object.assign(r, { status: 'match', kind: 'doc', id: hit.id, label: hit.num + ' · ' + Core.docClient(c, hit).name }); }
      else { const near = open.find(byKey); if (near) Object.assign(r, { status: 'diff', kind: 'doc', id: near.id, label: near.num + ' · ' + Core.docClient(c, near).name, diff: l.cents - near.total }); }
    } else if (l.cents < 0) {
      const open = c.purchases.filter(p => !p.paid && !used.has(p.id));
      const sup = p => (c.suppliers.find(s => s.id === p.supplierId) || { name: '' }).name;
      const byKey = p => (sup(p) && nc.includes(norm(sup(p)).split(' ')[0])) || (p.num && nc.includes(norm(p.num)));
      const hit = open.find(p => p.total === -l.cents && byKey(p));
      if (hit) { used.add(hit.id); Object.assign(r, { status: 'match', kind: 'purchase', id: hit.id, label: (hit.num || hit.concept) + ' · ' + sup(hit) }); }
      else { const near = open.find(byKey); if (near) Object.assign(r, { status: 'diff', kind: 'purchase', id: near.id, label: (near.num || near.concept) + ' · ' + sup(near), diff: -l.cents - near.total }); }
    }
    return r;
  });
};
Core.applyReconcile = function (c, r) {
  if (r.status !== 'match') throw new Error('El importe no cuadra con ningún documento: no se marca como cobrado');
  if (r.kind === 'doc') { const d = c.docs.find(x => x.id === r.id); if (d.total !== r.cents) throw new Error('El importe no cuadra'); return Core.collect(c, r.id, { date: r.date, method: 'transferencia' }); }
  const p = c.purchases.find(x => x.id === r.id); if (p.total !== -r.cents) throw new Error('El importe no cuadra');
  return Core.payPurchase(c, r.id, { date: r.date, method: 'transferencia' });
};
Core.sampleBankCSV = function (c) {
  const t = Core.today(); const rows = ['fecha;concepto;importe'];
  const rec = Core.receivables(c).filter(r => r.d.pay === 'credito');
  const pay = Core.payables(c);
  if (rec[0]) rows.push(addDays(t, -2) + ';TRANSF ' + rec[0].who.toUpperCase() + ' ' + rec[0].d.num + ';' + Core.eurPlain(rec[0].d.total));
  if (rec[1]) rows.push(addDays(t, -2) + ';TRANSF ' + rec[1].who.toUpperCase() + ' ' + rec[1].d.num + ';' + Core.eurPlain(rec[1].d.total - 1250));
  rows.push(addDays(t, -1) + ';INGRESO VARIOS SIN REFERENCIA;' + Core.eurPlain(31500));
  if (pay[0]) rows.push(addDays(t, -1) + ';PAGO ' + pay[0].who.toUpperCase() + ' ' + (pay[0].p.num || '') + ';-' + Core.eurPlain(pay[0].p.total));
  rows.push(addDays(t, -1) + ';COMISION MANTENIMIENTO CUENTA;-' + Core.eurPlain(1500));
  return rows.join('\n');
};

/* ───────── informes ───────── */
const yearF = (y, ex) => e => yearOf(e.date) === y && !(ex || []).includes(e.kind);
Core.trial = function (c, year) {
  const m = balances(c, yearF(year, ['regul', 'cierre']));
  const rows = Object.keys(m).sort().map(a => ({ acc: a, name: Core.accName(a), d: m[a].d, h: m[a].h, sd: Math.max(0, m[a].d - m[a].h), sh: Math.max(0, m[a].h - m[a].d) }));
  const t = rows.reduce((s, r) => ({ d: s.d + r.d, h: s.h + r.h, sd: s.sd + r.sd, sh: s.sh + r.sh }), { d: 0, h: 0, sd: 0, sh: 0 });
  return { rows, tot: t };
};
Core.ledger = function (c, acc, year) {
  const es = sortedJournal(c).filter(e => yearOf(e.date) === year && e.lines.some(l => l.acc === acc));
  let run = 0, D = 0, H = 0; const rows = [];
  for (const e of es) for (const l of e.lines) if (l.acc === acc) { run += l.d - l.h; D += l.d; H += l.h; rows.push({ e, d: l.d, h: l.h, run }); }
  return { rows, D, H, saldo: run };
};
Core.pyg = function (c, year) {
  const m = balances(c, yearF(year, ['regul', 'cierre']));
  const inc = a => 0 - net(m, a), exp = a => net(m, a);
  const ventas = inc('700') + inc('705'), compras = exp('600'), variacion = exp('610'), mermas = exp('659'), excep = inc('778');
  const gastosExpl = exp('621') + exp('622') + exp('628') + exp('629'), personal = exp('640') + exp('642'), amort = exp('681');
  const margenBruto = ventas - compras - variacion - mermas;
  const resultado = ventas + excep - compras - variacion - mermas - gastosExpl - personal - amort;
  return { ventas, compras, variacion, mermas, excep, gastosExpl, personal, amort, margenBruto, resultado,
    detalle: ['700', '705', '778', '600', '610', '659', '621', '622', '628', '629', '640', '642', '681'].filter(a => m[a]).map(a => ({ acc: a, name: Core.accName(a), v: ACC[a].type === 'ingreso' ? inc(a) : -exp(a) })) };
};
Core.balanceSheet = function (c, year) {
  const m = balances(c, e => e.date <= year + '-12-31' && !(e.kind === 'cierre' && yearOf(e.date) === year));
  const a = x => net(m, x), p = x => 0 - net(m, x);
  let res = 0; for (const k in m) if (k[0] === '6' || k[0] === '7') res += -(m[k].d - m[k].h);
  const ac = { inmovilizado: a('206') + a('216') + a('217') + a('218') + a('281'),
    existencias: a('300'), clientes: a('430'), hpDeudora: a('472') + a('4700'), tesoreria: a('570') + a('572') };
  const activo = ac.inmovilizado + ac.existencias + ac.clientes + ac.hpDeudora + ac.tesoreria;
  const pc = { deudasLP: p('170'), proveedores: p('400') + p('410'), hpAcreedora: p('477') + p('4750') };
  const pn = { capital: p('100'), reservas: p('113') + p('120'), resultadoPrev: p('129'), resultado: res };
  const pasivo = pc.deudasLP + pc.proveedores + pc.hpAcreedora;
  const patrimonio = pn.capital + pn.reservas + pn.resultadoPrev + pn.resultado;
  return { ac, pc, pn, activo, pasivo, patrimonio, cuadra: activo === pasivo + patrimonio, dif: activo - pasivo - patrimonio,
    items: { act: ['206', '216', '217', '218', '281', '300', '430', '472', '4700', '570', '572'].map(k => [k, a(k)]).filter(x => x[1]), pas: ['170', '400', '410', '477', '4750'].map(k => [k, p(k)]).filter(x => x[1]) } };
};
Core.cashflow = function (c, year) {
  const rows = []; let open = 0;
  const ap = c.journal.filter(e => e.kind === 'apertura' && yearOf(e.date) === year);
  ap.forEach(e => e.lines.forEach(l => { if (l.acc === '570' || l.acc === '572') open += l.d - l.h; }));
  const prevClose = c.journal.filter(e => yearOf(e.date) < year && e.kind !== 'cierre');
  let run = open;
  for (let mo = 1; mo <= 12; mo++) {
    const r = { mo, cobros: 0, pagos: 0, inversion: 0, financiacion: 0, neto: 0, saldo: 0 };
    for (const e of c.journal) {
      if (yearOf(e.date) !== year || monthOf(e.date) !== mo || ['apertura', 'cierre', 'regul'].includes(e.kind)) continue;
      let v = 0; e.lines.forEach(l => { if (l.acc === '570' || l.acc === '572') v += l.d - l.h; });
      if (!v) continue;
      const other = e.lines.map(l => l.acc);
      if (e.kind === 'activo' || other.some(a => /^2[01]/.test(a) && a !== '281')) r.inversion += v;
      else if (other.includes('100') || other.includes('170') || other.includes('113')) r.financiacion += v;
      else if (v > 0) r.cobros += v; else r.pagos += v;
      r.neto += v;
    }
    run += r.neto; r.saldo = run; rows.push(r);
  }
  const t = Core.today(); const proj = { r30: 0, r60: 0, r90: 0, p30: 0, p60: 0, p90: 0 };
  const bucket = (due, amt, pre) => { const dd = Math.max(0, diffDays(t, due)); if (dd <= 30) proj[pre + '30'] += amt; else if (dd <= 60) proj[pre + '60'] += amt; else if (dd <= 90) proj[pre + '90'] += amt; };
  Core.receivables(c).forEach(r => bucket(r.due, r.d.total, 'r')); Core.payables(c).forEach(r => bucket(r.due, r.p.total, 'p'));
  return { rows, open, close: run, proj };
};

/* ───────── cierre de ejercicio ───────── */
Core.closeYear = function (c) {
  const y = c.ejercicio;
  if (c.closed.includes(y)) throw new Error('Ejercicio ya cerrado');
  if (!c.amortYears[y] && c.assets.length) { try { Core.amortize(c, y); } catch (e) { /* nada que amortizar */ } }
  recomputeVariation(c);
  c.journal.forEach(e => { if (e.kind === 'var' && yearOf(e.date) === y) e.final = true; });
  const end = y + '-12-31';
  // 1) regularización de ingresos y gastos contra 129
  const m1 = balances(c, e => e.date <= end && e.kind !== 'cierre');
  const rl = []; let D = 0, H = 0;
  for (const k of Object.keys(m1).sort()) if (k[0] === '6' || k[0] === '7') { const n = net(m1, k); if (n > 0) { rl.push({ acc: k, h: n }); H += n; } else if (n < 0) { rl.push({ acc: k, d: -n }); D += -n; } }
  const resultado = D - H;   // beneficio si > 0
  if (resultado > 0) rl.push({ acc: '129', h: resultado }); else if (resultado < 0) rl.push({ acc: '129', d: -resultado });
  if (rl.length >= 2) post(c, { date: end, concept: 'Regularización de ingresos y gastos ' + y + ' (resultado ' + Core.eur(resultado) + ')', kind: 'regul', lines: rl, final: true }, { force: true });
  // 2) asiento de cierre
  const m2 = balances(c, e => e.date <= end && e.kind !== 'cierre');
  const cl = [];
  for (const k of Object.keys(m2).sort()) { const n = net(m2, k); if (n > 0) cl.push({ acc: k, h: n }); else if (n < 0) cl.push({ acc: k, d: -n }); }
  post(c, { date: end, concept: 'Asiento de cierre del ejercicio ' + y, kind: 'cierre', lines: cl, final: true }, { force: true });
  // 3) apertura del siguiente
  const ny = y + 1;
  const ap = cl.map(l => ({ acc: l.acc === '129' ? '120' : l.acc, d: l.h || 0, h: l.d || 0 }));
  const merged = {}; ap.forEach(l => { const o = merged[l.acc] || (merged[l.acc] = { acc: l.acc, d: 0, h: 0 }); o.d += l.d; o.h += l.h; });
  const al = Object.values(merged).map(l => { const n = l.d - l.h; return n >= 0 ? { acc: l.acc, d: n } : { acc: l.acc, h: -n }; }).filter(l => l.d || l.h);
  if (al.length >= 2) post(c, { date: ny + '-01-01', concept: 'Asiento de apertura ' + ny, kind: 'apertura', lines: al, final: true }, { force: true });
  c.closed.push(y); c.ejercicio = ny;
  audit(c, 'Ejercicio ' + y + ' cerrado (resultado ' + Core.eur(resultado) + '); abierto ' + ny);
  touch(c); return { resultado, year: y };
};
Core.undoClose = function (c) {
  const y = c.ejercicio - 1;
  if (!c.closed.includes(y) || c.closed[c.closed.length - 1] !== y) throw new Error('No hay cierre que deshacer');
  const other = c.journal.some(e => yearOf(e.date) === c.ejercicio && e.kind !== 'apertura' && !(e.kind === 'var'));
  const docsNew = c.docs.some(d => yearOf(d.date) > y) || c.purchases.some(p => yearOf(p.date) > y);
  if (other || docsNew) throw new Error('Ya hay movimientos en ' + c.ejercicio + ': no se puede deshacer el cierre');
  c.journal = c.journal.filter(e => !((e.kind === 'regul' || e.kind === 'cierre') && yearOf(e.date) === y) && !(e.kind === 'apertura' && yearOf(e.date) === c.ejercicio) && !(e.kind === 'var' && yearOf(e.date) === c.ejercicio));
  c.journal.forEach(e => { if (e.kind === 'var' && yearOf(e.date) === y) e.final = false; });
  c.closed = c.closed.filter(x => x !== y); c.ejercicio = y; audit(c, 'Cierre de ' + y + ' deshecho (demo)');
  touch(c);
};

/* ───────── conservación (retención) ───────── */
Core.retentionTimeline = function (c) {
  const r = c.retention; const cur = c.ejercicio;
  return r.years.map((y, i) => {
    const arch = r.archive[y];
    const docs = arch ? arch.docs : c.docs.filter(d => yearOf(d.date) === y).length;
    const kb = arch ? arch.docs * 100 : docs * 100;
    return { year: y, docs, kb, current: i === r.years.length - 1, oldest: i === 0 && r.years.length >= r.keep };
  });
};
Core.newYearArrives = function (c) {
  const r = c.retention; const last = r.years[r.years.length - 1]; const ny = last + 1; const log = [];
  while (r.years.length >= r.keep) {
    const old = r.years.shift(); delete r.archive[old];
    const t = 'Ejercicio ' + old + ' destruido al entrar ' + ny; audit(c, t); log.push(t);
  }
  r.years.push(ny); audit(c, 'Ejercicio ' + ny + ' entra en la conservación');
  return { entered: ny, log };
};
Core.setKeep = (c, n) => { if (!Number.isInteger(n) || n < 3 || n > 12) throw new Error('Años de conservación entre 3 y 12'); c.retention.keep = n; };

/* ───────── intérprete de voz ───────── */
const NUMW = { un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veinticinco: 25, treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100, doscientos: 200, trescientos: 300, quinientos: 500 };
const UNITS = { kilo: 'kg', kilos: 'kg', kg: 'kg', kgs: 'kg', unidad: 'ud', unidades: 'ud', ud: 'ud', uds: 'ud', caja: 'caja', cajas: 'caja', saco: 'ud', sacos: 'ud', rollo: 'ud', rollos: 'ud', hora: 'h', horas: 'h' };
const stem = s => s.replace(/(es|s)$/, '');
Core.parseVoice = function (c, text) {
  let t = norm(text).replace(/\s+/g, ' ').trim();
  const res = { type: /albaran/.test(t) ? 'albaran' : 'factura', clientId: null, pay: null, lines: [], warnings: [], raw: text };
  // número en palabras
  t = t.replace(/\b(treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa) y (uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)\b/g, (m, a, b) => String(NUMW[a] + NUMW[b]));
  t = t.replace(/\b(un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciseis|diecisiete|dieciocho|diecinueve|veinte|veinticinco|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|doscientos|trescientos|quinientos)\b/g, m => String(NUMW[m]));
  t = t.replace(/(\d+)\s*euros?\s*(?:con\s*)?(\d{1,2})\b/g, '$1,$2');
  if (/al contado|en efectivo/.test(t)) res.pay = 'efectivo'; else if (/con tarjeta/.test(t)) res.pay = 'tarjeta'; else if (/a credito|a plazo/.test(t)) res.pay = 'credito';
  t = t.replace(/\b(al contado|en efectivo|con tarjeta|a credito|a plazo)\b/g, ' ');
  // cliente
  let rest = t, best = null;
  for (const cl of c.clients) {
    const toks = norm(cl.name).split(/\s+/).filter(x => x.length >= 3);
    const key = toks[0]; if (!key) continue;
    const i = t.indexOf(key); if (i >= 0 && (!best || key.length > best.key.length)) best = { cl, key, i, toks };
  }
  if (best) {
    res.clientId = best.cl.id;
    rest = t.slice(best.i + best.key.length);
    const others = best.toks.slice(1); let ch = true;
    while (ch) { ch = false; for (const o of others) { const re = new RegExp('^\\s*' + o + '\\b'); if (re.test(rest)) { rest = rest.replace(re, ''); ch = true; } } }
  } else { rest = t.replace(/^\s*(?:una\s+)?(factura|albaran)(?:\s+(?:para|de)\s+\S+)?/, ''); res.warnings.push('No he reconocido el cliente: elígelo en la lista.'); }
  rest = rest.replace(/^[\s,:;.-]+/, '').replace(/^con\s+/, '');

function initSig() {
  const cv = $('#sigcv'); if (!cv) return;
  const dpr = window.devicePixelRatio || 1; const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0a3d2e';

  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10]; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { } const p = pos(e); SIGST.cur = [p]; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + .1, p[1] + .1); g.stroke(); });
  cv.addEventListener('pointermove', e => { if (!SIGST.cur) return; e.preventDefault(); const p = pos(e), l = SIGST.cur[SIGST.cur.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) < 1.2) return; SIGST.cur.push(p); g.lineTo(p[0], p[1]); g.stroke(); });

}

  r.onend = () => { VOZ.listening = false; if (CUR.name === 'voz') { render(true); if (VOZ.text) ACT.vozParse(); } };

ACT.vozParse = () => {

};
function vozDraftHtml() {

   ${S.profile === 'fruteria' ? '' : `<div class="field"><label>Tipo</label><select data-chg="draftField" data-k="VD" data-f="type"><option value="factura" ${D.type === 'factura' ? 'selected' : ''}>Factura</option><option value="albaran" ${D.type === 'albaran' ? 'selected' : ''}>Albarán</option></select></div>`}
   <div class="field"><label>Cobro</label><select data-chg="draftField" data-k="VD" data-f="pay">${Object.entries({ credito: 'A crédito', efectivo: 'Contado · efectivo', tarjeta: 'Contado · tarjeta' }).map(([k, v]) => `<option value="${k}" ${D.pay === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
   <div id="ed-VD">${lineEditor('VD')}</div>

}
FORMS.vozCrear = () => { const doc = draftToDoc('VD'); VOZ = { text: '', draft: null, rec: null, listening: false }; delete DRAFTS.VD; toast('Documento ' + doc.num + ' creado desde la voz'); go('#/doc/' + doc.id); };

/* ───── compras: foto al albarán del proveedor + entrada manual ───── */
let PUR = { step: 'inicio', img: null, ocr: null, form: null };
const OCR_SAMPLE = () => {
  const c = co(); const sup = c.suppliers.find(s => /Tropicales/.test(s.name)) || c.suppliers[0];
  const num = 'FT-0' + (420 + c.purchases.length); const dt = C.today();
  const pid = n => (c.products.find(p => C.norm(p.name).startsWith(C.norm(n))) || {}).id || '';
  return { supplierId: sup.id, supName: sup.name, num, date: dt, doubt: { prod: 'Mangos', field: 'precio', read: '3,1', ask: 3100 },
    lines: [{ pid: pid('Plátanos'), name: 'Plátanos', qty: '250', cost: '0,98', lot: '', origin: 'Tenerife', ok: true }, { pid: pid('Tomates'), name: 'Tomates', qty: '100', cost: '0,92', lot: '', origin: 'Gran Canaria', ok: true }, { pid: pid('Mangos'), name: 'Mangos', qty: '40', cost: '', lot: '', origin: 'Perú', ok: false }],
    text: sup.name.toUpperCase() + '\nALBARÁN Nº ' + num + '        FECHA ' + fd(dt) + '\n--------------------------------------------\nPLÁTANOS ........ 250 kg ..... 0,98\nTOMATES ......... 100 kg ..... 0,92\nMANGOS .......... 40 kg ...... [[3,1?]]\n--------------------------------------------\nRecibido: almacén · lote y origen: ver etiqueta' };
}
VIEWS.compra = () => {
  const c = co();
  const head = `<div class="row" style="margin-bottom:6px"><h1 class="sp">Compras y entrada de mercancía</h1></div>`;
  if (PUR.step === 'inicio') return head + `<div class="card"><p class="mut" style="margin-top:0">Haz una foto al albarán del proveedor: ECIRIUS <span class="ai">IA</span> lee el texto (simulado), te pregunta lo dudoso y da entrada a las existencias con lote, origen y coste.</p>
   <div class="row"><label class="btn big ai-b" style="cursor:pointer;margin:0">${ico('camera')} Hacer foto / subir albarán<input type="file" id="phfile" accept="image/*" capture="environment" class="hide" data-chg="phFile"></label><button class="btn sec big" data-act="phSample" data-testid="ocr-ejemplo">Usar albarán de ejemplo</button><button class="btn ghost big" data-act="phManual">Entrada manual</button></div></div>
   <div class="card"><h3>Últimas entradas</h3>${purList(c)}</div>`;
  if (PUR.step === 'leyendo') return head + `<div class="card"><h3>Leyendo el albarán… <span class="ai">IA</span></h3><div class="scan" style="margin:16px 0"></div>${PUR.img ? `<img class="pre" src="${PUR.img}" alt="Albarán">` : ''}</div>`;
  if (PUR.step === 'ocr') {
    const o = PUR.ocr, d = o.doubt, ans = o.answered;
    const txt = esc(o.text).replace('[[3,1?]]', ans ? '3,10' : '<span class="dbt">3,1?</span>');
    return head + `<div class="grid g2"><div class="card"><h3>Albarán</h3>${PUR.img ? `<img class="pre" src="${PUR.img}" alt="Foto del albarán">` : '<div class="mut">Albarán de ejemplo (sin foto)</div>'}</div>
    <div class="card"><h3>Texto leído <span class="chip ai">simulado</span></h3><div class="ocr" data-testid="ocr-text">${txt}</div></div></div>
    <div class="card"><table><thead><tr><th>Producto</th><th class="r">Cantidad</th><th class="r">Precio</th><th>Lectura</th></tr></thead><tbody>${o.lines.map(l => `<tr><td>${esc(l.name)}</td><td class="r">${esc(l.qty)} kg</td><td class="r ${l.ok || ans ? '' : 'cell-warn'}" data-testid="${l.ok ? '' : 'cell-dudosa'}">${l.ok ? esc(l.cost) : (ans ? '3,10' : '3,1 ?')}</td><td>${l.ok || ans ? '<span class="chip ok">Clara</span>' : '<span class="chip warn">Dudosa</span>'}</td></tr>`).join('')}</tbody></table></div>
    ${ans ? `<div class="alert ok" style="margin-top:12px">Precio de «Mangos» confirmado: ${esc(o.lines[2].cost)} €.</div><div class="row" style="margin-top:12px"><button class="btn big" data-act="phContinue" data-testid="ocr-continuar">Continuar con la entrada</button></div>`
      : `<div class="card" style="border:2px solid var(--warn);margin-top:12px" data-testid="ocr-pregunta"><b>En «${esc(d.prod)}» no se lee bien: precio… ¿${esc(d.read)} €?</b><div class="row" style="margin-top:10px"><button class="btn" data-act="phAnswer" data-v="yes" data-testid="ocr-si">Sí, 3,10 €</button><form class="row" data-form="phFix" style="gap:6px"><input type="text" inputmode="decimal" name="v" placeholder="Otro precio (€)" style="width:150px" required><button class="btn ghost" type="submit">No, corregir</button></form></div></div>`}`;
  }
  const F = PUR.form;
  return head + `<form class="card" data-form="compraOk"><h3>Datos de la entrada</h3><div class="alert warn hide form-err" style="margin-top:8px"></div>
   <div class="fgrid" style="margin-top:10px"><div class="field"><label>Proveedor</label><select data-chg="pfSet" data-f="supplierId">${opt(c.suppliers, F.supplierId, s => [s.id, s.name])}</select></div>
   <div class="field"><label>Nº de albarán del proveedor</label><input type="text" value="${esc(F.num)}" data-inp="pfSet" data-f="num" required></div>
   <div class="field"><label>Fecha del albarán</label><input type="date" value="${F.date}" data-chg="pfSet" data-f="date"></div>
   <div class="field"><label>Fecha de recepción</label><input type="date" value="${F.received}" data-chg="pfSet" data-f="received"></div>
   <div class="field"><label>Recibido por</label><input type="text" value="${esc(F.by)}" data-inp="pfSet" data-f="by" placeholder="Quién recibe la mercancía"></div>
   <div class="field"><label>Pago</label><select data-chg="pfSet" data-f="pay"><option value="credito" ${F.pay === 'credito' ? 'selected' : ''}>A crédito (Proveedores)</option><option value="banco" ${F.pay === 'banco' ? 'selected' : ''}>Contado · banco</option><option value="efectivo" ${F.pay === 'efectivo' ? 'selected' : ''}>Contado · caja</option></select></div></div>
   <h3 style="margin:16px 0 8px">Productos recibidos</h3><div class="tw"><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Coste unit. (€)</th><th>Lote</th><th>Origen</th><th></th></tr></thead><tbody>
   ${F.lines.map((l, i) => `<tr><td><select data-chg="pfLine" data-i="${i}" data-f="pid" style="min-width:140px">${opt(c.products, l.pid, p => [p.id, p.name])}</select></td><td><input type="text" inputmode="decimal" value="${esc(l.qty)}" data-inp="pfLine" data-i="${i}" data-f="qty" style="width:90px"></td><td><input type="text" inputmode="decimal" value="${esc(l.cost)}" data-inp="pfLine" data-i="${i}" data-f="cost" style="width:90px" class="${l.cost ? '' : 'cell-warn'}"></td><td><input type="text" value="${esc(l.lot)}" placeholder="auto" data-inp="pfLine" data-i="${i}" data-f="lot" style="width:120px"></td><td><input type="text" value="${esc(l.origin)}" data-inp="pfLine" data-i="${i}" data-f="origin" style="width:120px"></td><td><button type="button" class="x" data-act="pfDel" data-i="${i}">×</button></td></tr>`).join('')}</tbody></table></div>
   <button type="button" class="btn sec sm" data-act="pfAdd" style="margin-top:8px">+ Añadir producto</button>
   <div class="card" style="background:var(--g50);margin-top:12px" id="pf-tot">${pfTotals()}</div>
   <div class="row" style="margin-top:12px"><button class="btn big" type="submit" data-testid="confirmar-entrada">Confirmar y dar entrada en stock</button><button type="button" class="btn ghost" data-act="phReset">Cancelar</button></div></form>`;
};
function purList(c) {
  const ps = c.purchases.slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8);
  return `<div class="tw"><table><thead><tr><th>Fecha</th><th>Albarán</th><th>Proveedor</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>${ps.map(p => `<tr><td>${fd(p.date)}</td><td>${esc(p.num || p.concept)}</td><td>${esc((c.suppliers.find(s => s.id === p.supplierId) || { name: 'Varios' }).name)}</td><td class="r">${eur(p.total)}</td><td><span class="chip ${p.paid ? 'ok' : 'warn'}">${p.paid ? 'Pagado' : 'Pendiente de pago'}</span></td></tr>`).join('')}</tbody></table></div>`;
}
function pfTotals() { const c = co(), F = PUR.form; let base = 0; F.lines.forEach(l => { const q = C.parseQty(l.qty), k = C.parseEur(l.cost); if (!isNaN(q) && !isNaN(k)) base += C.lineAmount(q, k); }); const ig = C.divRound(base * c.igic, 100); return `<div class="row"><span class="sp mut">Base</span><b class="num">${eur(base)}</b></div><div class="row"><span class="sp mut">IGIC ${c.igic} %</span><b class="num">${eur(ig)}</b></div><div class="row"><span class="sp"><b>Total albarán</b></span><b class="num" style="font-size:20px">${eur(base + ig)}</b></div>`; }
ACT.phSample = () => { PUR = { step: 'leyendo', img: null, ocr: OCR_SAMPLE(), form: null }; render(); setTimeout(() => { if (PUR.step === 'leyendo') { PUR.step = 'ocr'; if (CUR.name === 'compra') render(); } }, 1100); };
ACT.phFile = t => {
  const f = t.files && t.files[0]; if (!f) return;
  PUR = { step: 'leyendo', img: URL.createObjectURL(f), ocr: OCR_SAMPLE(), form: null }; render();
  setTimeout(() => { if (PUR.step === 'leyendo') { PUR.step = 'ocr'; if (CUR.name === 'compra') render(); } }, 1400);
};
ACT.phAnswer = () => { PUR.ocr.lines[2].cost = '3,10'; PUR.ocr.answered = true; render(true); };
FORMS.phFix = (f, d) => { const v = C.parseEur(d.get('v')); if (isNaN(v) || v <= 0) throw new Error('Precio no válido'); PUR.ocr.lines[2].cost = C.eurPlain(v); PUR.ocr.answered = true; render(true); };
ACT.phContinue = () => {
  const o = PUR.ocr; PUR.form = { supplierId: o.supplierId, num: o.num, date: o.date, received: o.date, by: 'Almacén', pay: 'credito', lines: o.lines.map(l => ({ pid: l.pid, qty: l.qty, cost: l.cost, lot: '', origin: l.origin })) };
  PUR.step = 'form'; render();
};
ACT.phManual = () => { const c = co(); PUR = { step: 'form', img: null, ocr: null, form: { supplierId: c.suppliers[0].id, num: '', date: today(), received: today(), by: '', pay: 'credito', lines: [{ pid: c.products[0].id, qty: '', cost: '', lot: '', origin: '' }] } }; render(); };
ACT.phReset = () => { PUR = { step: 'inicio', img: null, ocr: null, form: null }; render(); };
ACT.pfSet = t => { PUR.form[t.dataset.f] = t.value; if (t.dataset.f === 'date' && PUR.form.received < t.value) { PUR.form.received = t.value; render(true); } };
ACT.pfLine = t => { PUR.form.lines[+t.dataset.i][t.dataset.f] = t.value; const e = $('#pf-tot'); if (e) e.innerHTML = pfTotals(); };
ACT.pfAdd = () => { const c = co(); PUR.form.lines.push({ pid: c.products[0].id, qty: '', cost: '', lot: '', origin: '' }); render(true); };
ACT.pfDel = t => { PUR.form.lines.splice(+t.dataset.i, 1); if (!PUR.form.lines.length) PUR.form.lines.push({ pid: co().products[0].id, qty: '', cost: '', lot: '', origin: '' }); render(true); };
FORMS.compraOk = () => {
  const F = PUR.form, c = co();
  const lines = F.lines.map(l => { const q = C.parseQty(l.qty), k = C.parseEur(l.cost); if (isNaN(q) || q <= 0) throw new Error('Cantidad no válida'); if (isNaN(k)) throw new Error('Falta el coste de un producto (campo en naranja)'); return { pid: l.pid, qty: q, cost: k, lot: l.lot, origin: l.origin }; });
  const p = C.addPurchase(c, { supplierId: F.supplierId, num: F.num, date: F.date, receivedDate: F.received, receivedBy: F.by, pay: F.pay, lines });
  save(); PUR = { step: 'inicio', img: null, ocr: null, form: null }; toast('Entrada registrada: ' + p.num + ' · asiento y stock actualizados'); go('#/stock');
};

/* ECIRIUS · interfaz (parte 2: fin de mes, deuda, conservación, stock, contabilidad, datos, ajustes) */

/* ───── fin de mes ───── */
VIEWS.mes = p => {
  const c = co(); const t = C.today();
  const prev = C.addDays(t.slice(0, 8) + '01', -1).slice(0, 7);
  const months = Array.from(new Set(c.docs.filter(d => d.type === 'albaran').map(d => d.date.slice(0, 7)).concat([t.slice(0, 7), prev]))).sort().reverse();
  const ym = p.q.m || months.find(m => C.monthSummary(c, m).length) || prev;
  const sum = C.monthSummary(c, ym);
  const invs = c.docs.filter(d => d.groups && d.date.slice(0, 7) >= ym).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 12);
  return `<div class="row" style="margin-bottom:12px"><h1 class="sp">Fin de mes: factura con relación de albaranes</h1></div>
  <div class="card"><div class="row"><div class="field" style="min-width:200px"><label>Mes de albaranes</label><select data-chg="mesSel">${months.map(m => `<option value="${m}" ${m === ym ? 'selected' : ''}>${m.slice(5)}/${m.slice(0, 4)}</option>`).join('')}</select></div>
   <p class="mut sp" style="margin:0">Se agrupan los albaranes <b>firmados</b> y sin facturar de cada cliente en una sola factura a crédito. Los sin firmar no entran.</p></div></div>
  <div class="card"><div class="tw"><table><thead><tr><th>Cliente</th><th class="r">Albaranes firmados</th><th class="r">Total</th><th>Sin firmar</th><th></th></tr></thead><tbody>
  ${sum.map(s => `<tr><td><b>${esc(s.client.name)}</b><div class="mut" style="font-size:12px">${esc(s.signed.map(a => a.num).join(', '))}</div></td><td class="r">${s.signed.length}</td><td class="r">${eur(s.total)}</td><td>${s.unsigned.length ? `<span class="chip warn">${s.unsigned.length} sin firmar</span>` : '<span class="chip ok">todo firmado</span>'}</td><td class="r">${s.signed.length ? `<button class="btn sm" data-act="mesFact" data-cl="${s.client.id}" data-m="${ym}" data-testid="agrupar">Agrupar en factura</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="mut">No hay albaranes pendientes de facturar en este mes.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Facturas con relación emitidas</h3>${invs.length ? invs.map(d => docRow(c, d)).join('') : '<p class="mut">Aún no hay facturas agrupadas.</p>'}</div>`;
};
ACT.mesSel = t => go('#/mes?m=' + t.value);
ACT.mesFact = t => {
  const c = co(); const doc = C.invoiceMonth(c, t.dataset.cl, t.dataset.m, today());
  save(); toast('Factura ' + doc.num + ' creada con ' + doc.groups.length + ' albaranes'); go('#/doc/' + doc.id);
};

/* ───── deuda ───── */
VIEWS.deuda = () => {
  const c = co(), a = C.aging(c), t = C.today();
  const th = '<th class="r">0-30 días</th><th class="r">31-60</th><th class="r">61-90</th><th class="r">&gt;90</th><th class="r">Total</th>';

  return `<div class="row" style="margin-bottom:12px"><h1 class="sp">Informe de deuda por antigüedad</h1><button class="btn ghost" data-act="csv" data-what="deuda">CSV</button></div>
  <div class="grid g4"><div class="card kpi"><span class="v">${eur(a.tot.b0)}</span><span class="l">0-30 días</span></div><div class="card kpi"><span class="v">${eur(a.tot.b1)}</span><span class="l">31-60 días</span></div><div class="card kpi warn"><span class="v">${eur(a.tot.b2)}</span><span class="l">61-90 días</span></div><div class="card kpi warn"><span class="v" style="color:var(--bad)">${eur(a.tot.b3)}</span><span class="l">Más de 90 días</span></div></div>
  <div class="card"><div class="tw"><table><thead><tr><th>Cliente</th>${th}</tr></thead><tbody>${a.rows.map(r => `<tr><td><b>${esc(r.client.name)}</b></td>${cell(r.b0)}${cell(r.b1)}${cell(r.b2)}${cell(r.b3)}<td class="r"><b>${eur(r.total)}</b></td></tr>`).join('')}
  <tr class="tot"><td>TOTAL</td><td class="r">${eur(a.tot.b0)}</td><td class="r">${eur(a.tot.b1)}</td><td class="r">${eur(a.tot.b2)}</td><td class="r">${eur(a.tot.b3)}</td><td class="r" data-testid="deuda-total">${eur(a.tot.total)}</td></tr></tbody></table></div>
  <p class="legend">Antigüedad = días desde la fecha del documento. Los albaranes ya agrupados en una factura cuentan solo en la factura.</p></div>
  <div class="card"><h3>Documentos pendientes</h3>${a.rows.map(r => r.docs.map(x => { const wa = 'https://wa.me/' + digitsPhone(r.client.phone) + '?text=' + encodeURIComponent('Hola, te recordamos que la ' + (x.d.type === 'factura' ? 'factura ' : 'albarán ') + x.d.num + ' por ' + eur(x.d.total) + ' está pendiente de pago (vencimiento ' + fd(x.due) + '). Gracias. (Demo ECIRIUS)'); return `<div class="row" style="padding:8px 0;border-bottom:1px solid #eef3f0"><a href="#/doc/${x.d.id}"><b>${esc(x.d.num)}</b></a><span class="sp">${esc(r.client.name)} · ${x.age} días</span><span class="chip ${x.overdue ? 'bad' : 'mut'}">vence ${fd(x.due)}</span><b>${eur(x.d.total)}</b><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(wa)}">Reclamar por WhatsApp</a></div>`; }).join('')).join('') || '<p class="mut">Sin deuda pendiente.</p>'}</div>`;
};

/* ───── conservación ───── */
VIEWS.conserva = () => {
  const c = co(), R = c.retention, tl = C.retentionTimeline(c);
  const kb = tl.reduce((s, x) => s + x.kb, 0); const pct = kb / (100 * 1024 * 1024 * 1024) * 100;
  const nextYear = R.years[R.years.length - 1] + 1;
  return `<h1>Conservación en la nube <span class="chip warn">por validar con asesor</span></h1>
  <p class="mut">Sin archivadores ni cajas: los documentos viven en la nube durante el plazo configurado. Al entrar un ejercicio nuevo se destruye el más antiguo, con registro de auditoría.</p>
  <div class="card"><div class="row"><h3 class="sp">Ejercicios conservados (${R.years.length} de ${R.keep})</h3><div class="field" style="width:180px"><label>Años a conservar</label><select data-chg="keepSel" data-testid="keep">${[4, 5, 6, 7, 8, 10].map(n => `<option value="${n}" ${n === R.keep ? 'selected' : ''}>${n} años${n === 6 ? ' (por defecto)' : ''}</option>`).join('')}</select></div></div>
   <div class="timeline" style="margin-top:12px" data-testid="timeline">${tl.map(x => `<div class="yr ${x.current ? 'cur' : ''} ${x.oldest ? 'old' : ''}" data-year="${x.year}"><b>${x.year}</b><small>${x.docs} documentos</small><small>${x.current ? 'En curso' : (x.oldest ? 'Se destruirá al entrar ' + nextYear : 'Guardado')}</small></div>`).join('')}</div>

   <div class="alert warn" style="margin-top:12px">Plazos de conservación (6 años, destrucción de uno al entrar otro) <b>por validar con asesor</b>: la ley puede exigir otros plazos y condiciones.</div></div>

FORMS.prodNew = (f, d) => { const pr = C.parseEur(d.get('price') || '0'); C.addProduct(co(), { name: d.get('name'), unit: d.get('unit'), family: d.get('family'), price: isNaN(pr) ? 0 : pr }); commit('Producto creado'); closeModal(); render(true); };
ACT.prodEdit = t => {

VIEWS.cuadre = p => {

   <td class="r"><input type="text" inputmode="decimal" style="width:90px;text-align:right" value="${x.counted == null ? '' : fq(x.counted)}" placeholder="contar" data-chg="countSet" data-id="${x.p.id}" aria-label="Stock contado de ${esc(x.p.name)}"></td>
   <td class="r ${x.diff ? 'cell-warn' : ''}" data-testid="dif-${esc(x.p.name)}">${x.diff == null ? '<span class="mut">—</span>' : (x.diff === 0 ? '<span class="ok-t">cuadra ✔</span>' : (x.diff > 0 ? '+' : '') + fq(x.diff))}</td>
   <td class="r"><button class="btn ${x.diff ? 'warn' : 'ghost'} sm" data-act="mermaModal" data-id="${x.p.id}" data-testid="btn-merma">Registrar merma/ajuste</button></td></tr>`).join('') || '<tr><td colspan="8" class="mut">Sin resultados.</td></tr>'}</tbody></table></div></div>
  ${sel ? cuadreDetail(c, sel) : '<p class="legend">Toca un producto para ver la trazabilidad por lote.</p>'}`;

function cuadreDetail(c, pid) {

  const doc = id => c.docs.find(d => d.id === id);
  return `<div class="card" style="margin-top:14px" data-testid="trazabilidad"><h3>Trazabilidad · ${esc(p.name)}</h3>
   <p class="mut" style="margin:6px 0">Entradas ${fq(b.entradas)} + iniciales ${fq(b.iniciales)}${b.ajustesPos ? ' + ajustes ' + fq(b.ajustesPos) : ''} − ventas ${fq(b.ventas)} − mermas ${fq(b.mermas)} = <b>${fq(b.teorico)} ${unitL(p.unit)}</b></p>
   <div class="tw"><table><thead><tr><th>Lote</th><th>Origen</th><th>Albarán prov.</th><th>Fecha</th><th class="r">Entró</th><th class="r">Queda</th><th class="r">Coste ud.</th></tr></thead><tbody>${lots.map(l => `<tr><td>${esc(l.code)}</td><td>${esc(l.origin)}</td><td>${esc(l.supNum || (l.kind === 'inicial' ? 'Existencia inicial' : l.kind))}</td><td>${fd(l.date)}</td><td class="r">${fq(l.qtyIn)}</td><td class="r"><b>${fq(l.left)}</b></td><td class="r">${eur(l.cost)}</td></tr>`).join('')}</tbody></table></div>
   <h3 style="margin:14px 0 6px">Salidas (FIFO por lote)</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Documento</th><th>Lote</th><th class="r">Cantidad</th><th class="r">Coste</th></tr></thead><tbody>${mv.map(m => { const l = c.lots.find(x => x.id === m.lotId) || {}, d = doc(m.docId); return `<tr><td>${fd(m.date)}</td><td><span class="chip ${m.type === 'merma' ? 'warn' : ''}">${m.type}</span></td><td>${d ? `<a href="#/doc/${d.id}">${esc(d.num)}</a> · ${esc(C.docClient(c, d).name)}` : esc(m.note || '')}</td><td>${esc(l.code || '')}</td><td class="r">−${fq(m.qty)}</td><td class="r">${eur(m.cost)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="mut">Sin salidas.</td></tr>'}</tbody></table></div></div>`;
}
let cqT;
ACT.cuadreQ = t => { clearTimeout(cqT); cqT = setTimeout(() => { history.replaceState(null, '', '#/cuadre?q=' + encodeURIComponent(t.value)); const pos = t.selectionStart; render(true); const n = $('#cq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); };
ACT.countSet = t => { const v = t.value.trim(); const q = v === '' ? null : C.parseQty(v); if (q !== null && isNaN(q)) throw new Error('Cantidad no válida'); C.setCount(co(), t.dataset.id, q); save(); render(true); };
ACT.mermaModal = t => {
  const c = co(), p = C.findProduct(c, t.dataset.id), b = C.stockBreakdown(c, p.id);
  const diff = p.counted == null ? null : p.counted - b.teorico;
  modal('Registrar merma / ajuste · ' + p.name, `<form data-form="merma" data-id="${p.id}"><div class="alert warn hide form-err"></div>
   <p>Stock teórico: <b>${fq(b.teorico)} ${p.unit}</b>${diff != null ? ' · contado: <b>' + fq(p.counted) + '</b> · diferencia: <b class="warn-t">' + (diff > 0 ? '+' : '') + fq(diff) + '</b>' : ''}</p>
   ${diff ? `<div class="alert info"><div><b>Regularizar a lo contado</b><br>${diff < 0 ? 'Se registra una merma de ' + fq(-diff) + ' ' + p.unit + ' (Debe 659 / Haber 300).' : 'Se registra una entrada por ajuste de ' + fq(diff) + ' ' + p.unit + ' (Debe 300 / Haber 778).'}<div style="margin-top:8px"><button class="btn" type="submit" name="mode" value="ajuste" data-testid="ajustar">Ajustar a stock contado</button></div></div></div>` : ''}
   <h3 style="margin:14px 0 8px">Registrar una merma manual</h3><div class="fgrid"><div class="field"><label>Cantidad (${p.unit})</label><input type="text" name="qty" inputmode="decimal" placeholder="0" data-testid="merma-qty"></div><div class="field"><label>Motivo</label><select name="motive"><option>Madurez excesiva</option><option>Rotura</option><option>Caducidad</option><option>Robo o extravío</option><option>Otro</option></select></div><div class="field"><label>Fecha</label><input type="date" name="date" value="${today()}"></div></div>
   <div class="row" style="margin-top:14px"><button class="btn warn" type="submit" name="mode" value="merma" data-testid="registrar-merma">Registrar merma</button></div></form>`);

FORMS.merma = (f, d) => {
  const c = co(), id = f.dataset.id, mode = (d.get('mode') || 'merma'); const date = d.get('date') || today();
  if (mode === 'ajuste') { const r = C.adjustToCount(c, id, today()); commit('Ajuste registrado: asiento de ' + eur(r.value || 0)); }
  else { const q = C.parseQty(d.get('qty')); if (isNaN(q) || q <= 0) throw new Error('Indica la cantidad de la merma'); const r = C.registerMerma(c, { pid: id, qty: q, date, motive: d.get('motive') }); commit('Merma registrada: asiento Debe 659 / Haber 300 por ' + eur(r.value)); }

/* ───── contabilidad ───── */
const CTABS = [['diario', 'Libro diario'], ['mayor', 'Libro mayor'], ['sumas', 'Sumas y saldos'], ['balance', 'Balance de situación'], ['pyg', 'Pérdidas y ganancias'], ['tesoreria', 'Cash flow / tesorería'], ['venc', 'Deudores y acreedores'], ['pagos', 'Compras y gastos'], ['igic', 'IGIC trimestral'], ['activos', 'Activos fijos'], ['banco', 'Conciliación bancaria'], ['cierre', 'Cierre de ejercicio']];
let CYEAR = null;
const curYear = c => CYEAR && (CYEAR === c.ejercicio || c.journal.some(e => +e.date.slice(0, 4) === CYEAR)) ? CYEAR : c.ejercicio;
VIEWS.conta = p => {
  const c = co(); const tab = p.a || 'diario'; const y = curYear(c);
  const years = Array.from(new Set(c.journal.map(e => +e.date.slice(0, 4)).concat([c.ejercicio]))).sort();

  <div class="tabs" data-testid="ctabs">${CTABS.map(([k, l]) => `<a href="#/conta/${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</div>${body}`;
};
ACT.yearSel = t => { CYEAR = +t.value; render(true); };
const CV = {};
const entryTable = (c, es) => es.map(e => `<tbody class="entry"><tr style="background:var(--g50)"><td><b>${e.num}</b></td><td>${fd(e.date)}</td><td colspan="2"><b>${esc(e.concept)}</b> <span class="chip ${e.auto ? 'ai' : 'mut'}">${e.auto ? 'automático' : e.kind}</span></td><td class="r"></td></tr>${e.lines.map(l => `<tr><td></td><td>${l.acc}</td><td>${esc(C.accName(l.acc))}</td><td class="r">${l.d ? C.eurPlain(l.d) : ''}</td><td class="r">${l.h ? C.eurPlain(l.h) : ''}</td></tr>`).join('')}</tbody>`).join('');
CV.diario = (c, y, p) => {
  const q = (p.q.q || '').toLowerCase();
  let es = C.sortedJournal(c).filter(e => +e.date.slice(0, 4) === y);
  if (q) es = es.filter(e => (e.concept + ' ' + e.kind + ' ' + e.lines.map(l => l.acc).join(' ')).toLowerCase().includes(q));
  let D = 0, H = 0; es.forEach(e => e.lines.forEach(l => { D += l.d; H += l.h; }));
  return `<div class="card"><div class="row"><input type="search" class="search sp" placeholder="Buscar concepto o cuenta…" value="${esc(p.q.q || '')}" data-inp="diarioQ"><button class="btn" data-act="asientoModal" data-testid="nuevo-asiento">+ Asiento manual</button><button class="btn ghost" data-act="csv" data-what="diario" data-year="${y}">CSV</button></div>
  <p class="legend">Los asientos se generan solos al registrar compras, ventas, cobros, pagos, mermas, amortizaciones… El debe siempre cuadra con el haber.</p>
  <div class="tw"><table data-testid="diario"><thead><tr><th>Nº</th><th>Fecha / cuenta</th><th>Concepto / nombre</th><th class="r">Debe</th><th class="r">Haber</th></tr></thead>${entryTable(c, es)}<tfoot><tr class="tot"><td colspan="3">Totales (${es.length} asientos) ${D === H ? '<span class="chip ok">Debe = Haber ✔</span>' : '<span class="chip bad">DESCUADRADO</span>'}</td><td class="r" data-testid="diario-debe">${C.eurPlain(D)}</td><td class="r">${C.eurPlain(H)}</td></tr></tfoot></table></div></div>`;
};
let dqT; ACT.diarioQ = t => { clearTimeout(dqT); dqT = setTimeout(() => { history.replaceState(null, '', '#/conta/diario?q=' + encodeURIComponent(t.value)); const pos = t.selectionStart; render(true); const n = $('input.search'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); };
ACT.asientoModal = () => {
  const c = co(); const row = () => `<div class="lrow" style="display:grid;grid-template-columns:1fr 100px 100px 34px;gap:6px;margin-bottom:6px"><select name="acc">${C.PLAN.map(a => `<option value="${a.code}">${a.code} · ${esc(a.name)}</option>`).join('')}</select><input type="text" name="d" inputmode="decimal" placeholder="Debe" data-inp="asTot"><input type="text" name="h" inputmode="decimal" placeholder="Haber" data-inp="asTot"><button type="button" class="x" data-act="asDel">×</button></div>`;
  modal('Asiento manual', `<form data-form="asiento"><div class="alert warn hide form-err" data-testid="as-err"></div><div class="fgrid"><div class="field"><label>Fecha</label><input type="date" name="date" value="${today()}"></div><div class="field full"><label>Concepto</label><input type="text" name="concept" required placeholder="Descripción del asiento"></div></div>
  <div id="asrows" style="margin-top:12px">${row()}${row()}</div><button type="button" class="btn sec sm" data-act="asAdd">+ Línea</button><div class="card" style="background:var(--g50);margin-top:10px" id="astot"></div>
  <div class="row" style="margin-top:12px"><button class="btn" type="submit" data-testid="as-guardar">Contabilizar</button></div></form>`);
  window.__asRow = row; ACT.asTot();
};
ACT.asAdd = () => { $('#asrows').insertAdjacentHTML('beforeend', window.__asRow()); };
ACT.asDel = t => { const r = t.closest('.lrow'); if ($$('#asrows .lrow').length > 2) { r.remove(); ACT.asTot(); } };
ACT.asTot = () => { let D = 0, H = 0; $$('#asrows .lrow').forEach(r => { const d = C.parseEur(r.querySelector('[name=d]').value), h = C.parseEur(r.querySelector('[name=h]').value); if (!isNaN(d)) D += d; if (!isNaN(h)) H += h; }); const e = $('#astot'); if (e) e.innerHTML = `<div class="row"><span class="sp">Debe <b>${eur(D)}</b> · Haber <b>${eur(H)}</b></span>${D === H && D ? '<span class="chip ok">cuadra ✔</span>' : `<span class="chip warn">diferencia ${eur(D - H)}</span>`}</div>`; };
FORMS.asiento = (f, d) => {
  const accs = d.getAll('acc'), ds = d.getAll('d'), hs = d.getAll('h'); const lines = [];
  accs.forEach((a, i) => { const dd = ds[i].trim() ? C.parseEur(ds[i]) : 0, hh = hs[i].trim() ? C.parseEur(hs[i]) : 0; if (isNaN(dd) || isNaN(hh)) throw new Error('Importe no válido en la línea ' + (i + 1)); if (dd || hh) lines.push({ acc: a, d: dd, h: hh }); });
  C.postManual(co(), { date: d.get('date'), concept: d.get('concept'), lines }); commit('Asiento contabilizado'); closeModal(); render(true);
};

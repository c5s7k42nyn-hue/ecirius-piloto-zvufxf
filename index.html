  return `<div class="card"><h3>Cierre del ejercicio ${y}</h3>
   ${chk(true, 'Existencias regularizadas (asiento de variación automático)')}${chk(!unpaidAm, 'Amortización del inmovilizado contabilizada')}${chk(!igicPend.length, 'IGIC trimestral liquidado' + (igicPend.length ? ' (faltan ' + igicPend.map(q => q + 'T').join(', ') + ')' : ''))}
   <div class="srow t"><span>Resultado provisional</span><span class="num ${g.resultado < 0 ? 'bad-t' : 'ok-t'}">${eur(g.resultado)}</span></div>
   <p class="legend">El cierre genera: 1) regularización de ingresos y gastos contra la cuenta 129, 2) asiento de cierre y 3) asiento de apertura del ejercicio ${y + 1}. En esta demo se puede cerrar el ejercicio en curso y deshacerlo.</p>
   <div class="row">${closed ? `<span class="chip ok">Ejercicio ${y} cerrado</span>` : (y === c.ejercicio ? `<button class="btn big warn" data-act="closeYear" data-testid="cerrar">Cerrar ejercicio ${y}</button>` : '<span class="mut">Selecciona el ejercicio en curso.</span>')}${c.closed.length && c.closed[c.closed.length - 1] === c.ejercicio - 1 ? `<button class="btn ghost" data-act="undoClose" data-testid="deshacer">Deshacer cierre de ${c.ejercicio - 1} (demo)</button>` : ''}</div></div>`;
};
ACT.closeYear = () => { const c = co(); if (!window.confirm('¿Cerrar el ejercicio ' + c.ejercicio + '? Se generan los asientos de regularización, cierre y apertura (se puede deshacer en la demo).')) return; const r = C.closeYear(c); CYEAR = null; commit('Ejercicio ' + r.year + ' cerrado · resultado ' + eur(r.resultado)); render(); };
ACT.undoClose = () => { const c = co(); C.undoClose(c); CYEAR = null; commit('Cierre deshecho'); render(); };

/* ───── clientes y proveedores ───── */
VIEWS.datos = p => {
  const c = co(); const tab = p.a || 'clientes'; const list = tab === 'clientes' ? c.clients : c.suppliers;
  return `<div class="row" style="margin-bottom:12px"><h1 class="sp">Clientes y proveedores</h1><button class="btn" data-act="partyModal" data-kind="${tab}" data-testid="nuevo-tercero">+ ${tab === 'clientes' ? 'Cliente' : 'Proveedor'}</button></div>
  <div class="tabs"><a href="#/datos/clientes" class="${tab === 'clientes' ? 'on' : ''}">Clientes (${c.clients.length})</a><a href="#/datos/proveedores" class="${tab === 'proveedores' ? 'on' : ''}">Proveedores (${c.suppliers.length})</a></div>
  <div class="card"><div class="tw"><table><thead><tr><th>Nombre</th><th>NIF</th><th>Correo</th><th>Teléfono</th><th class="r">Pago (días)</th><th></th></tr></thead><tbody>${list.map(x => { const w = C.nifWarning(x.nif); return `<tr><td><b>${esc(x.name)}</b><div class="mut" style="font-size:12px">${esc(x.address)}</div></td><td>${esc(x.nif)}${w ? `<div><span class="chip warn">${w}</span></div>` : ''}</td><td>${esc(x.email) || '<span class="mut">—</span>'}</td><td>${esc(x.phone) || '<span class="mut">—</span>'}</td><td class="r">${x.terms}</td><td class="r"><button class="btn ghost sm" data-act="partyModal" data-kind="${tab}" data-id="${x.id}">Editar</button></td></tr>`; }).join('')}</tbody></table></div><p class="legend">Solo datos fiscales y de contacto: esta demo no guarda datos bancarios.</p></div>`;
};
ACT.partyModal = t => {
  const c = co(); const cl = t.dataset.kind === 'clientes'; const x = t.dataset.id ? (cl ? c.clients : c.suppliers).find(y => y.id === t.dataset.id) : { name: '', nif: '', address: '', email: '', phone: '', terms: 30 };
  modal((t.dataset.id ? 'Editar ' : 'Nuevo ') + (cl ? 'cliente' : 'proveedor'), `<form data-form="party" data-kind="${t.dataset.kind}" data-id="${t.dataset.id || ''}"><div class="alert warn hide form-err"></div><div class="fgrid"><div class="field full"><label>Nombre o razón social</label><input type="text" name="name" value="${esc(x.name)}" required></div><div class="field"><label>NIF/CIF</label><input type="text" name="nif" value="${esc(x.nif)}"></div><div class="field"><label>Plazo de pago (días)</label><input type="number" name="terms" value="${x.terms}" min="0" max="180"></div><div class="field"><label>Correo</label><input type="email" name="email" value="${esc(x.email)}"></div><div class="field"><label>Teléfono / WhatsApp</label><input type="tel" name="phone" value="${esc(x.phone)}"></div><div class="field full"><label>Dirección fiscal</label><input type="text" name="address" value="${esc(x.address)}"></div></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">Guardar</button></div></form>`);
};
FORMS.party = (f, d) => {
  const c = co(), cl = f.dataset.kind === 'clientes', o = { name: d.get('name').trim(), nif: d.get('nif').trim(), email: d.get('email').trim(), phone: d.get('phone').trim(), address: d.get('address').trim(), terms: +d.get('terms') };
  if (f.dataset.id) { const x = (cl ? c.clients : c.suppliers).find(y => y.id === f.dataset.id); Object.assign(x, o); } else if (cl) C.addClient(c, o); else C.addSupplier(c, o);
  commit('Guardado'); closeModal(); render(true);
};

/* ───── notas (versión B) y reservas (restaurante) ───── */
VIEWS.notas = () => {
  const c = co(), t = C.today();
  return `<div class="row" style="margin-bottom:12px"><h1 class="sp">Notas de cliente y recordatorios</h1><button class="btn" data-act="notaModal">+ Nota</button></div>
  <div class="card">${c.notes.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(n => `<div class="row" style="padding:10px 0;border-bottom:1px solid #eef3f0;${n.done ? 'opacity:.5' : ''}"><span class="chip ${!n.done && n.date < t ? 'warn' : ''}">${fd(n.date)}${!n.done && n.date < t ? ' · vencido' : ''}</span><div class="sp"><b>${esc((c.clients.find(x => x.id === n.clientId) || {}).name)}</b><div class="mut">${esc(n.text)}</div></div><button class="btn ghost sm" data-act="notaDone" data-id="${n.id}">${n.done ? 'Reabrir' : 'Hecho'}</button></div>`).join('') || '<p class="mut">Sin notas.</p>'}</div>`;
};
ACT.notaDone = t => { const n = co().notes.find(x => x.id === t.dataset.id); n.done = !n.done; save(); render(true); };
ACT.notaModal = () => { const c = co(); modal('Nueva nota de cliente', `<form data-form="nota"><div class="alert warn hide form-err"></div><div class="fgrid"><div class="field"><label>Cliente</label><select name="cl">${opt(c.clients, '', x => [x.id, x.name])}</select></div><div class="field"><label>Recordar el</label><input type="date" name="date" value="${C.addDays(C.today(), 1)}"></div><div class="field full"><label>Nota</label><textarea name="text" required></textarea></div></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">Guardar</button></div></form>`); };
FORMS.nota = (f, d) => { const c = co(); c.notes.push({ id: 'n' + (++c.seq.n), clientId: d.get('cl'), text: d.get('text'), date: d.get('date'), done: false }); commit('Nota guardada'); closeModal(); render(true); };
VIEWS.reservas = () => {
  const c = co(); const days = Array.from(new Set(c.reservas.map(r => r.date))).sort();
  return `<div class="row" style="margin-bottom:12px"><h1 class="sp">Reservas</h1><button class="btn" data-act="resModal">+ Reserva</button></div>
  ${days.map(dd => `<div class="card"><h3>${fd(dd)}${dd === C.today() ? ' · hoy' : ''} <span class="chip">${c.reservas.filter(r => r.date === dd && r.status !== 'cancelada').reduce((s, r) => s + r.people, 0)} comensales</span></h3>${c.reservas.filter(r => r.date === dd).sort((a, b) => a.time < b.time ? -1 : 1).map(r => `<div class="row" style="padding:9px 0;border-bottom:1px solid #eef3f0;${r.status === 'cancelada' ? 'opacity:.45' : ''}"><span class="chip">${esc(r.time)}</span><div class="sp"><b>${esc(r.name)}</b> · ${r.people} pers.<div class="mut" style="font-size:12.5px">${esc(r.note)} ${esc(r.phone)}</div></div><span class="chip ${r.status === 'llegó' ? 'ok' : r.status === 'cancelada' ? 'bad' : 'mut'}">${r.status}</span>${r.status === 'pendiente' ? `<button class="btn sm sec" data-act="resSt" data-id="${r.id}" data-s="llegó">Llegó</button><button class="btn sm ghost" data-act="resSt" data-id="${r.id}" data-s="cancelada">Cancelar</button>` : ''}</div>`).join('')}</div>`).join('')}`;
};
ACT.resSt = t => { co().reservas.find(r => r.id === t.dataset.id).status = t.dataset.s; save(); render(true); };
ACT.resModal = () => modal('Nueva reserva', `<form data-form="res"><div class="alert warn hide form-err"></div><div class="fgrid"><div class="field"><label>Fecha</label><input type="date" name="date" value="${C.today()}"></div><div class="field"><label>Hora</label><input type="text" name="time" value="14:00" required></div><div class="field"><label>Nombre</label><input type="text" name="name" required></div><div class="field"><label>Personas</label><input type="number" name="people" value="2" min="1"></div><div class="field"><label>Teléfono</label><input type="tel" name="phone"></div><div class="field full"><label>Nota</label><input type="text" name="note"></div></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">Guardar reserva</button></div></form>`);
FORMS.res = (f, d) => { const c = co(); c.reservas.push({ id: 'r' + (++c.seq.r), date: d.get('date'), time: d.get('time'), name: d.get('name'), people: +d.get('people'), phone: d.get('phone'), note: d.get('note'), status: 'pendiente' }); commit('Reserva guardada'); closeModal(); render(true); };

/* ───── ajustes ───── */
VIEWS.ajustes = () => {
  const c = co();
  return `<h1 style="margin-bottom:12px">Ajustes</h1>
  <div class="grid g2"><div class="card"><h3>Empresa y numeración</h3><dl class="dl" style="margin-top:10px"><dt>Empresa</dt><dd>${esc(c.name)}</dd><dt>NIF</dt><dd>${esc(c.nif)}</dd><dt>Serie</dt><dd>${esc(c.serie)}</dd><dt>Próxima factura</dt><dd>${esc(c.serie)}-${String(c.num.fac + 1).padStart(4, '0')}</dd><dt>Próximo albarán</dt><dd>A-${esc(c.serie)}-${String(c.num.alb + 1).padStart(4, '0')}</dd><dt>Ejercicio</dt><dd>${c.ejercicio}</dd></dl><p class="legend">Epik y Montego llevan numeración y contabilidad independientes. Cambia de empresa arriba.</p></div>
  <div class="card"><h3>IGIC y valoración</h3><div class="fgrid" style="margin-top:10px"><div class="field"><label>Tipo de IGIC de ejemplo (%)</label><input type="text" value="${c.igic}" data-chg="igicSet" inputmode="decimal"></div><div class="field"><label>Valoración de existencias</label><select data-chg="methodSel"><option value="fifo" ${c.method === 'fifo' ? 'selected' : ''}>FIFO</option><option value="medio" ${c.method === 'medio' ? 'selected' : ''}>Coste medio</option></select></div></div><p class="legend">El tipo se aplica a documentos nuevos. Valor de ejemplo, por validar.</p></div></div>
  <div class="card"><h3>Datos de la demo</h3><p class="mut">Todo se guarda solo en este navegador (localStorage). No hay servidor.</p><div class="row"><button class="btn bad" data-act="resetData" data-testid="reiniciar">Reiniciar datos de ejemplo</button><button class="btn ghost" data-act="exportJson">Descargar copia (JSON)</button></div></div>
  <div class="card"><h3>Limitaciones de esta demo</h3><ul class="mut" style="margin:6px 0 0;padding-left:18px"><li>Todo es simulado: sin Verifactu real, sin sello digital de la AEAT y sin firma electrónica cualificada.</li><li>La lectura del albarán por foto y la IA son simuladas; el dictado usa el navegador.</li><li>Importes de IGIC, plazos de conservación y asientos son de ejemplo y deben validarse con un asesor.</li><li>Datos ficticios; sin datos bancarios.</li></ul></div>`;
};
ACT.igicSet = t => { const v = parseFloat(String(t.value).replace(',', '.')); if (isNaN(v) || v < 0 || v > 30) throw new Error('Tipo no válido'); co().igic = v; save(); toast('Tipo de IGIC actualizado'); };
ACT.resetData = () => { if (!window.confirm('¿Reiniciar todos los datos de ejemplo? Se perderán los cambios hechos en este navegador.')) return; localStorage.removeItem(KEY); S = C.newState(); save(); CYEAR = null; PUR = { step: 'inicio' }; VOZ = { text: '', draft: null }; Object.keys(DRAFTS).forEach(k => delete DRAFTS[k]); toast('Datos de ejemplo reiniciados'); go('#/inicio'); };
ACT.exportJson = () => { download('ecirius_copia_' + C.today() + '.json', JSON.stringify(S, null, 1), 'application/json'); };

/* ───── arranque ───── */
window.addEventListener('hashchange', () => render());
function boot() {
  load();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  render();
  window.__ecirius = { get state() { return S; }, Core: C, go, save, render };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
</html>
